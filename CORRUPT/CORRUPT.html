/* ============================================================
   CORRUPT — series #16 (16_corrupt) — v0.6.0
   A datamosh FUI that cannot heal. Dense telemetry screen where
   everything is a pure function of (column, row, tick, hash).
   A latent scar-map is fixed at birth; corruption tides rise and
   fall over it, tear-bands shear whole rows sideways, chroma
   splits on dying cells. Integrity bleeds out and never returns.
   The machine keeps broadcasting anyway.

v0.5.0 widens the fleet again:
     · 33 panel types drawn from a shared pool
     · 16 layout archetypes (slot-based, panels reassigned per cycle)
     · 16 centre instruments
   Anything constant across a panel's cells is hoisted into a
   per-frame memo; vector shapes rasterise once and are read back
   by cell, so cost tracks glyphs drawn rather than cells scanned.
     ·  6 palettes × 5 harmonies, rotating independently

v0.6.0 finishes the mood-board pass:
     · block-displacement glitch — whole bands shear sideways
       in crisp macroblocks, re-randomising every ~second
     · PULSE — an ECG cardiogram; the heart slows, then flattens
       as integrity bleeds out
     · BIO CULTURE — a drifting tank of nuclei and curved
       filaments that die cell by cell with the corruption

   AMBIENT reconfigures on a jittered cycle: new archetype, new
   panel assignment, new centre instrument, new palette, new hue.
   M ambient · N layout · V instrument · C palette · F fullscreen
   wheel scrub · space hold · R reseed · S save plate.
   ============================================================ */

/* ---------- seeded PRNG / hash noise ---------- */
function cyrb128(str){let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0,k;i<str.length;i++){k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067);h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213);h4=h1^Math.imul(h4^k,2716044179);}
  h1=Math.imul(h3^(h1>>>18),597399067);h2=Math.imul(h4^(h2>>>22),2869860233);
  h3=Math.imul(h1^(h3>>>17),951274213);h4=Math.imul(h2^(h4>>>19),2716044179);
  h1^=h2^h3^h4;h2^=h1;h3^=h1;h4^=h1;return[h1>>>0,h2>>>0,h3>>>0,h4>>>0];}
function sfc32(a,b,c,d){return function(){a>>>=0;b>>>=0;c>>>=0;d>>>=0;
  let t=(a+b)|0;a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11)|0;d=d+1|0;t=t+d|0;c=c+t|0;
  return(t>>>0)/4294967296;};}
const B58="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function newHash(){let s="oo";for(let i=0;i<49;i++)s+=B58[Math.floor(Math.random()*B58.length)];return s;}
function makeR(h){const s=cyrb128(h);return sfc32(s[0],s[1],s[2],s[3]);}
let SEEDN=0.1;
function h31(a,b,c){const n=Math.sin(a*127.1+b*311.7+c*74.7+SEEDN)*43758.5453;return n-Math.floor(n);}
function vn(x,y,salt){
  const xi=Math.floor(x),yi=Math.floor(y);
  const xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h31(xi,yi,salt),b=h31(xi+1,yi,salt);
  const c2=h31(xi,yi+1,salt),d=h31(xi+1,yi+1,salt);
  return a+(b-a)*u+(c2-a)*v+(a-b-c2+d)*u*v;
}
function hsl(h,s,l){
  h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l));
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m2=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}
  else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}
  else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  return[Math.floor((r+m2)*255),Math.floor((g+m2)*255),Math.floor((b+m2)*255)];
}

/* ---------- layout: slot-based archetypes ----------
   An archetype yields a set of rectangular slots plus a centre
   viewport. Panels are assigned to slots at reconfig time from a
   shared pool, so the same archetype rarely reads the same twice. */
let TOPY,BOTY;
let centerRect={x0:0,y0:0,x1:0,y1:0};
function layout(){TOPY=2;BOTY=rows-2;}
function RX(cw,rh,x0,y0,x1,y1){
  x0=Math.max(0,Math.min(cw-4,Math.round(x0)));
  y0=Math.max(TOPY,Math.min(rh-4,Math.round(y0)));
  x1=Math.max(x0+2,Math.min(cw-2,Math.round(x1)));
  y1=Math.max(y0+2,Math.min(rh-3,Math.round(y1)));
  return{x0,y0,x1,y1};
}
function stackV(x0,x1,y0,y1,n){
  const out=[],H=(y1-y0+1)/n;
  for(let i=0;i<n;i++)out.push([x0,Math.round(y0+i*H),x1,Math.round(y0+(i+1)*H)-2]);
  return out;
}
function stackH(x0,x1,y0,y1,n){
  const out=[],W=(x1-x0+1)/n;
  for(let i=0;i<n;i++)out.push([Math.round(x0+i*W),y0,Math.round(x0+(i+1)*W)-2,y1]);
  return out;
}
function nb(y0,y1,want){return Math.max(1,Math.min(want,Math.floor((y1-y0+1)/7)));}
function nc(x0,x1,want){return Math.max(1,Math.min(want,Math.floor((x1-x0+1)/16)));}
function mkSlots(cw,rh,list){
  const out=[];
  for(const r of list){
    const q=RX(cw,rh,r[0],r[1],r[2],r[3]);
    if(q.x1-q.x0<13||q.y1-q.y0<5)continue;
    let bad=false;
    for(const o of out){if(q.x0<=o.x1&&q.x1>=o.x0&&q.y0<=o.y1&&q.y1>=o.y0){bad=true;break;}}
    if(!bad)out.push(q);
  }
  return out;
}
const ARCH=[
 {name:"TRIPOD",build(cw,rh){
   let L=Math.max(20,Math.floor(cw*0.20)),Rr=cw-Math.max(20,Math.floor(cw*0.20));
   if(Rr-L<14){L=Math.max(10,Math.floor(cw*0.26));Rr=Math.max(L+14,Math.floor(cw*0.74));}
   return{slots:mkSlots(cw,rh,[].concat(
     stackV(1,L-2,TOPY,rh-3,nb(TOPY,rh-3,3)),
     stackV(Rr+1,cw-2,TOPY,rh-3,nb(TOPY,rh-3,4)))),
     center:RX(cw,rh,L-1,TOPY,Rr,rh-3)};}},

 {name:"FRAME",build(cw,rh){
   const L=Math.max(16,Math.floor(cw*0.15)),TB=TOPY+4;
   return{slots:mkSlots(cw,rh,[[1,TOPY,cw-2,TB-1]].concat(
     stackV(1,L,TB+1,rh-3,nb(TB+1,rh-3,2)),
     stackV(cw-L-1,cw-2,TB+1,rh-3,nb(TB+1,rh-3,2)),
     [[L+2,rh-8,cw-L-3,rh-3]])),
     center:RX(cw,rh,L+1,TB+1,cw-L-2,rh-9)};}},

 {name:"CORNER",build(cw,rh){
   const L=Math.max(16,Math.floor(cw*0.16)),M=Math.max(12,Math.floor(rh*0.24));
   return{slots:mkSlots(cw,rh,[
     [1,TOPY,L,M-1],[cw-L-1,TOPY,cw-2,M-1],[L+2,TOPY,cw-L-3,M-1],
     [1,rh-M,L,rh-3],[cw-L-1,rh-M,cw-2,rh-3],[L+2,rh-8,cw-L-3,rh-3]]),
     center:RX(cw,rh,L+1,M+1,cw-L-2,rh-9)};}},

 {name:"THRONE",build(cw,rh){
   const dY=Math.max(TOPY+9,rh-13),W=Math.max(20,Math.floor(cw*0.18));
   return{slots:mkSlots(cw,rh,stackH(1,cw-2,dY,rh-3,nc(1,cw-2,4)).concat(
     [[2,TOPY,W,dY-2],[cw-W-1,TOPY,cw-3,dY-2]])),
     center:RX(cw,rh,W+2,TOPY,cw-W-3,dY-2)};}},

 {name:"SPINE",build(cw,rh){

   const cx0=half-Math.floor(sp/2),cx1=half+Math.floor(sp/2);

 {name:"STACK",build(cw,rh){

   const b1=rh-3-Math.max(6,Math.floor(rh*0.22));
   return{slots:mkSlots(cw,rh,stackH(1,cw-2,TOPY,t1-1,nc(1,cw-2,3)).concat(
     stackH(1,cw-2,b1+1,rh-3,nc(1,cw-2,2)))),
     center:RX(cw,rh,1,t1+1,cw-2,b1-1)};}},

 {name:"MOSAIC",build(cw,rh){
   const L=Math.max(26,Math.floor(cw*0.58));

 {name:"GUTTER",build(cw,rh){

 {name:"ORBITAL",build(cw,rh){

 {name:"CROSS",build(cw,rh){

 {name:"PINWHEEL",build(cw,rh){

      [1,TOPY,cw-2-Lr,T-1],
      [cw-1-Lr,TOPY,cw-2,B-1],
      [Ll+1,B+1,cw-2,rh-3],

 {name:"TERRACE",build(cw,rh){

];

const POOL=Object.keys(SPEC);

function assignPanels(salt,slots){
  const pool=POOL.slice();
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(h31(i,salt,1400)*(i+1));
    const tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;
  }
  if(h31(0,salt,1401)<0.8){                 /* the wound stays on screen */
    const i=pool.indexOf("INTEGRITY");
    if(i>0){pool.splice(i,1);pool.unshift("INTEGRITY");}
  }
  const used={},out=[];
  for(const s of slots){
    const w=s.x1-s.x0-1,h=s.y1-s.y0-1;
    for(const id of pool){
      if(used[id])continue;
      const sp=SPEC[id];
      if(w>=sp.w&&h>=sp.h){used[id]=1;out.push({id,x0:s.x0,y0:s.y0,x1:s.x1,y1:s.y1});break;}
    }
  }
  return out;
}
function applySkin(salt){
  const lv=ARCH[SKIN%ARCH.length].build(cols,rows);
  PANELS=assignPanels(salt,lv.slots);
  if(PANELS.length===0){                     /* viewport too small for this archetype */
    const fb=mkSlots(cols,rows,[[1,TOPY,cols-2,TOPY+6]]);
    PANELS=assignPanels(salt,fb);
    if(PANELS.length)lv.center=RX(cols,rows,1,TOPY+8,cols-2,rows-3);
  }
  PINDEX={};for(const p of PANELS)PINDEX[p.id]=p;
  centerRect=lv.center;
  /* in ambient, most panels collapse to title + frame; a rotating
     minority keeps broadcasting so the screen still breathes */
  AMB_LIVE={};
  const keep=Math.max(1,Math.round(PANELS.length*0.38));
  const order=PANELS.map((p,i)=>[h31(i,salt,1402),p.id]).sort((a,b)=>a[0]-b[0]);
  for(let i=0;i<keep&&i<order.length;i++)AMB_LIVE[order[i][1]]=1;
}

/* ---------- latent scar map: fixed at birth ---------- */
function computeLatent(){
  LAT=new Float32Array(N);
  let s=0;
  for(let i=0;i<N;i++){
    const x=i%cols,y=(i/cols)|0;
    const f0=vn(x*0.021,y*0.031,900);
    const f1=vn(x*0.13,y*0.16,901);
    const f2=vn(x*0.055,y*0.072,902);
    let c=sstep(0.55,0.95,f0)+f1*sstep(0.5,0.9,f0)*0.45+f2*0.18;
    if(c>1)c=1;
    LAT[i]=c;s+=c;
  }
  meanLat=s/N;
}

/* ---------- zone / border ---------- */
function zoneAt(x,y){
  if(x<0||x>=cols)return "CENTER";
  if(y<=1)return "TITLE";
  if(y>=BOTY)return "BOTTOM";
  for(const p of PANELS){
    if(x>=p.x0&&x<=p.x1&&y>=p.y0&&y<=p.y1)return p.id;
  }
  return "CENTER";
}
function edgeCh(x,y,p){
  if(x===p.x0&&y===p.y0)return"┌";if(x===p.x1&&y===p.y0)return"┐";
  if(x===p.x0&&y===p.y1)return"└";if(x===p.x1&&y===p.y1)return"┘";
  if(y===p.y0||y===p.y1)return"─";return"│";
}
function zoneHue(z){
  if(z==="TITLE")return HUE_CUR+HOFF;
  if(z==="INTEGRITY"||z==="SECTORS")return HUE_CUR+HOFF;

/* ---------- shared glyph helpers ---------- */
function hdr(txt,lx,w){
  if(lx<txt.length&&lx<w)return{ch:txt[lx],acc:true,b:0.8};
  return null;
}
function ambHide(p,ly){return amb>0.5&&!AMB_LIVE[p.id]&&ly>0;}
function slopeCh(a){
  let d=(((a*180/Math.PI)%180)+180)%180;
  if(d<22.5||d>=157.5)return"─";
  if(d<67.5)return"╲";
  if(d<112.5)return"│";
  return"╱";
}
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function segD(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
  let tt=L>0?((px-ax)*dx+(py-ay)*dy)/L:0;
  tt=tt<0?0:tt>1?1:tt;
  return Math.hypot(px-(ax+dx*tt),py-(ay+dy*tt));
}

  const s=Math.floor(t);
  const h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=s%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");

function gHexgrid(x,y,t,p){

  if(tileX<0||tileX>=gridW)return null;
  const u=lx-off-tileX*TW;

    if(u===0)return{ch:"╱",b:0.4};
    if(u===2)return{ch:"╲",b:0.4};
    if(u===1){
      if(cursor)return{ch:"◉",acc:true,b:0.9};

    }

    if(u===1)return{ch:Lv>0.55?"▓":"▁",b:0.2+Lv*0.35,warn:Lv>0.55};

/* ---------- v0.6.0: pulse + bio culture ---------- */
function pulseShape(u){
  const g=(u0,w,a)=>a*Math.exp(-((u0-u)*(u0-u))/(w*w));
  return g(0.22,0.028,0.14)+g(0.33,0.016,-0.10)+g(0.375,0.011,1.0)
       + g(0.41,0.020,-0.28)+g(0.60,0.050,0.20);
}
function gPulse(x,y,t,p){
  const lx=x-p.x0-1,ly=y-p.y0-1;if(lx<0)return null;
  const w=p.x1-p.x0-1,h=p.y1-p.y0-1;
  if(ly===0)return hdr("PULSE",lx,w);
  if(ambHide(p,ly))return null;
  if(ly===h-1&&h>=7){
    const flat=avgC>0.5;
    const bpm=Math.max(12,Math.round((88-avgC*64)*(0.9+0.1*Math.sin(TD*0.13+SEEDN))));
    const s="HR "+String(bpm).padStart(3,"0")+(flat?" · FLAT":" · RHYTHM");
    if(lx<s.length)return{ch:s[lx],b:0.5,warn:flat};
    return null;
  }
  if(ly<1||ly>h-2)return null;
  const flat=avgC>0.5;
  const mid=1+(h-2)*0.5;
  const amp=Math.max(1.2,(h-3)*0.42)*(flat?0.09:1);
  const sp=0.125;
  const f=q=>((q%1)+1)%1;
  /* five exp() per sample, sampled twice per cell: hoist per column */
  const val=k=>memo("pl"+p.id+"|"+k,()=>pulseShape(f(TD*0.9+k*sp)));
  const v0=val(lx-1),v1=val(lx);
  /* phase advances with lx, so the trace scrolls left and the newest

  if(lx===w-1&&Math.abs(ly-Math.round(mid-v1*amp))<0.6)
    return{ch:"◆",b:0.95,acc:true};
  const y0=Math.round(mid-v0*amp),y1=Math.round(mid-v1*amp);
  if(ly>=Math.min(y0,y1)&&ly<=Math.max(y0,y1))
    return{ch:v1>v0?"╲":v1<v0?"╱":"│",b:0.85,acc:true};
  if(ly===Math.round(mid)&&lx%3===0&&Math.abs(v1)<0.08)return{ch:"─",b:0.14};

}
function gBio(x,y,t,p){
  const lx=x-p.x0-1,ly=y-p.y0-1;if(lx<0)return null;
  const w=p.x1-p.x0-1,h=p.y1-p.y0-1;
  if(ly===0)return hdr("BIO CULTURE",lx,w);
  if(ambHide(p,ly))return null;
  if(ly===h-1&&h>=7){
    const s="CULTURE "+String(1+Math.floor(h31(0,0,1576)*8))+" · "+String(Math.max(0,Math.round((1-avgC)*100)))+"%";
    if(lx<s.length)return{ch:s[lx],b:0.45,warn:avgC>0.55};
    return null;
  }
  const R=memo("bi"+p.id,()=>{
    const m=new Map();
    const set=(gx,gy,g)=>{
      gx=Math.round(gx);gy=Math.round(gy);
      if(gx<0||gx>=w||gy<1||gy>=h)return;
      const k=gy*w+gx,cur=m.get(k);

    }

    };

      const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
      const dx2=B[0]-A[0],dy2=B[1]-A[1];

      const cyl=my+dx2*0.32*(1+h31(salt,3,1578)*0.6);

    }

  });

const CBUF=new Map();

/* per-frame memo: panels are pure functions of (x,y,t) and get called

const MEMO=new Map();

function topoAt(gx,gy){
  const fx=(gx-TOPOX)/TOPOS,fy=(gy-TOPOY)/TOPOS;

  if(i>TOPOW-2)i=TOPOW-2;if(j>TOPOH-2)j=TOPOH-2;
  const u=fx-i,v=fy-j,o=j*TOPOW+i;

function cput(x,y,ch,b,acc){

function cline(x0,y0,x1,y1,b,acc,forceCh){

  const ch=forceCh||slopeCh(Math.atan2(dy,dx));

function cring(cx,cy,r,ch,b,acc){
  const steps=Math.max(20,Math.round(r*10));

function buildCenter(td){
  CBUF.clear();
  const cr=centerRect;
  const cw2=cr.x1-cr.x0,ch2=cr.y1-cr.y0;
  if(cw2<6||ch2<5){CXRAD=[cr.x0,cr.y0,2];return;}
  const rad=Math.max(3,Math.min(Math.floor(cw2*0.44/AR),Math.floor(ch2*0.42)));
  const cx=cr.x0+cw2*0.5,cy=cr.y0+ch2*0.5;
  CXRAD=[Math.round(cx),Math.round(cy),rad];
  const nm=INSTR[INST];

  if(nm==="RADAR"){
    for(let k=1;k<=3;k++)cring(cx,cy,rad*k/3,k===3?"·":"∙",k===3?0.32:0.2);
    for(let i=0;i<12;i++){
      const a=i/12*TAU;
      cput(cx+Math.cos(a)*(rad+1.2)*AR,cy+Math.sin(a)*(rad+1.2),i%3===0?"+":"·",i%3===0?0.45:0.24,i%3===0);
    }

      return[X,Y*Math.cos(tl)-Z*Math.sin(tl),Y*Math.sin(tl)+Z*Math.cos(tl)];
    };

    cline(X0,Y1,X0+arm,Y1,0.6,true,"─");cline(X0,Y1-2,X0,Y1,0.6,true,"│");
    cline(X1-arm,Y1,X1,Y1,0.6,true,"─");cline(X1,Y1-2,X1,Y1,0.6,true,"│");
    for(let i=2;i<=rad;i++){

    }
    for(let i=2;i<=Math.floor(rad*0.8);i++){cput(cx,cy-i,"│",0.4);cput(cx,cy+i,"│",0.4);}
    cput(cx,cy,"+",0.95,true);
    for(let i=-4;i<=4;i++){

    for(let i=-5;i<=5;i++)cput(cx+i*4*AR,cr.y0+1,i%2===0?"┬":"·",0.3,i===0);
    for(let k=0;k<4;k++){

      const x1=v[0]*Math.cos(ry)+v[2]*Math.sin(ry);
      const z1=-v[0]*Math.sin(ry)+v[2]*Math.cos(ry);
      const y1=v[1]*Math.cos(rx)-z1*Math.sin(rx);
      const z2=v[1]*Math.sin(rx)+z1*Math.cos(rx);
      const pp=2.8/(2.8+z2);
      return[cx+x1*rad*AR*pp*0.78,cy+y1*rad*pp*0.78,z2];
    });
    for(const e of E){
      const dep=(P[e[0]][2]+P[e[1]][2])*0.5;
      cline(P[e[0]][0],P[e[0]][1],P[e[1]][0],P[e[1]][1],0.5-dep*0.14);
    }
    for(const q of P)cput(q[0],q[1],"◆",0.85,true);
    cring(cx,cy,rad+1,"·",0.12);
  }
  else if(nm==="WEB"){
    const NN=7+Math.floor(h31(3,0,1330)*5);
    const pts=[];
    for(let i=0;i<NN;i++){
      const a=i/NN*TAU+0.34*Math.sin(td*0.19+i*1.1);
      const rr=rad*(0.32+0.68*h31(i,1,1331));
      pts.push([cx+Math.cos(a)*rr*AR,cy+Math.sin(a)*rr]);
    }
    for(let i=0;i<NN;i++)for(let j=i+1;j<NN;j++){
      if(h31(i,j,1332)>0.34)continue;
      const live=Math.sin(td*0.8+i*1.7+j*0.9)>-0.2;
      cline(pts[i][0],pts[i][1],pts[j][0],pts[j][1],live?0.4:0.16);
    }
    for(let i=0;i<NN;i++){
      const dead=h31(i,4,1333)>0.82;
      cput(pts[i][0],pts[i][1],dead?"✕":i===0?"◉":"◆",dead?0.5:0.85,!dead);
    }
  }
  else if(nm==="GYRE"){
    const arms=2+Math.floor(h31(4,0,1350)*2);
    const rot=td*0.5;
    const cnt=Math.min(520,Math.max(100,rad*rad*3));
    for(let i=1;i<=cnt;i++){
      const f=i/cnt;
      const a=rot+f*4.5+(i%arms)*(TAU/arms);
      const rr=rad*Math.pow(f,0.72);
      const n2=vn(f*13,td*0.8,1351);
      cput(cx+Math.cos(a)*rr*AR,cy+Math.sin(a)*rr,
        n2>0.66?"∙":n2>0.3?"·":"˙",
        (0.10+0.5*f)*(0.6+0.4*Math.sin(i*2.3+td*2)),i%9===0);
    }
    cput(cx,cy,"◉",0.95,true);
    cring(cx,cy,rad*0.18,"·",0.4,true);
  }
  else if(nm==="CIRCUIT"){
    const NN=Math.max(6,Math.min(12,Math.floor(rad*0.9)));
    const pts=[];
    for(let i=0;i<NN;i++)pts.push([
      cx+(h31(i,0,1360)-0.5)*2*rad*AR,
      cy+(h31(i,1,1361)-0.5)*2*rad]);
    for(let i=0;i<NN;i++)for(let j=i+1;j<NN;j++){
      if(h31(i,j,1362)>0.55)continue;
      const A=pts[i],B=pts[j];
      const mid=(A[0]+B[0])/2;
      const bri=0.18+0.3*h31(i,j,1363);
      cline(A[0],A[1],mid,A[1],bri);
      cline(mid,A[1],mid,B[1],bri);
      cline(mid,B[1],B[0],B[1],bri);
    }
    for(let i=0;i<NN;i++){
      const pulse=(Math.sin(td*0.7+i*1.4)+1)/2;
      cput(pts[i][0],pts[i][1],pulse>0.6?"◆":i===0?"◉":"●",0.25+0.6*pulse,pulse>0.6||i===0);
    }
  }
  else if(nm==="CLOCK"){
    const tm=td*4;
    const sec=tm%60,min=(tm/60)%60,hr=(tm/3600)%12;
    const secA=sec/60*TAU-Math.PI/2;
    const minA=min/60*TAU-Math.PI/2+(sec/60)*0.1047;
    const hrA=(hr+min/60)/12*TAU-Math.PI/2;
    cring(cx,cy,rad,"·",0.3);
    for(let i=0;i<12;i++){
      const a=i/12*TAU-Math.PI/2;
      cput(cx+Math.cos(a)*(rad+0.4)*AR,cy+Math.sin(a)*(rad+0.4),i%3===0?"+":"·",i%3===0?0.6:0.3,i%3===0);
    }
    cline(cx,cy,cx+Math.cos(hrA)*rad*0.45*AR,cy+Math.sin(hrA)*rad*0.45,0.55);
    cline(cx,cy,cx+Math.cos(minA)*rad*0.68*AR,cy+Math.sin(minA)*rad*0.68,0.75);
    cline(cx,cy,cx+Math.cos(secA)*rad*0.86*AR,cy+Math.sin(secA)*rad*0.86,0.95,true);
    cput(cx,cy,"◉",0.95,true);
  }
  else if(nm==="TORUS"){
    const R1=rad*0.62,R2=rad*0.30;
    const ry=td*0.27,rx=0.55+0.38*Math.sin(td*0.11);
    for(let i=0;i<30;i++){
      const u=i/30*TAU;
      const cu=Math.cos(u),su=Math.sin(u);
      for(let j=0;j<22;j++){
        const v2=j/22*TAU;
        const rr2=R1+R2*Math.cos(v2);
        const X=rr2*cu,Y=R2*Math.sin(v2),Z=rr2*su;
        const x1=X*Math.cos(ry)+Z*Math.sin(ry),z1=-X*Math.sin(ry)+Z*Math.cos(ry);
        const y1=Y*Math.cos(rx)-z1*Math.sin(rx),z2=Y*Math.sin(rx)+z1*Math.cos(rx);
        const pp=2.9/(2.9+z2/Math.max(1,rad));
        cput(cx+x1*AR*pp,cy+y1*pp,z2>0?"·":"∙",z2>0?0.52:0.15,j===0&&z2>0);
      }
    }
  }
  else if(nm==="ATTRACTOR"){
    const a=2.0+0.62*Math.sin(td*0.061),b=-2.0+0.52*Math.cos(td*0.047);
    const c2=1.2+0.55*Math.sin(td*0.033+SEEDN),d2=-1.6+0.44*Math.cos(td*0.039);
    let px=0.1,py=0.1;
    for(let i=0;i<1500;i++){
      const nx=Math.sin(a*py)-Math.cos(b*px);
      py=Math.sin(c2*px)-Math.cos(d2*py);px=nx;
      if(i<25)continue;
      cput(cx+px*rad*0.46*AR,cy+py*rad*0.46,
        i%11===0?"∙":"·",0.16+0.42*(i/1500),i%149===0);
    }
    cring(cx,cy,rad+1,"·",0.10);
  }
  else if(nm==="VORONOI"){
    VORSEED.length=0;
    const NS=7+Math.floor(h31(5,0,1610)*4);
    for(let k=0;k<NS;k++){
      const bx=cr.x0+(0.12+0.76*h31(k,0,1611))*cw2+Math.sin(td*0.17+k)*cw2*0.05;
      const byy=cr.y0+(0.12+0.76*h31(k,1,1612))*ch2+Math.cos(td*0.13+k*1.7)*ch2*0.05;
      VORSEED.push([bx,byy]);
      cput(bx,byy,k===0?"◉":"◆",0.92,true);
    }
  }
  else if(nm==="STARFIELD"){
    for(let k=0;k<150;k++){
      const sp=0.30+h31(k,0,1620)*0.85;
      const z=1.7-(((td*sp+h31(k,1,1621)*5)%1.7));
      if(z<0.07)continue;
      const ax=(h31(k,2,1622)-0.5)*2.5,ay=(h31(k,3,1623)-0.5)*2.5;
      const br=clamp01((1.7-z)/1.7);
      cput(cx+ax/z*rad*0.5*AR,cy+ay/z*rad*0.5,
        br>0.82?"◆":br>0.52?"∙":"·",0.10+br*0.82,br>0.86);
      if(br>0.55){
        const z2=z+0.12;
        cput(cx+ax/z2*rad*0.5*AR,cy+ay/z2*rad*0.5,"·",0.08+br*0.28);
      }
    }
    cput(cx,cy,"+",0.5,true);
  }
  else if(nm==="TOPO"){
    TOPOX=cr.x0;TOPOY=cr.y0;
    TOPOW=Math.ceil(cw2/TOPOS)+2;TOPOH=Math.ceil(ch2/TOPOS)+2;
    const need=TOPOW*TOPOH;
    if(!TOPOF||TOPOF.length<need)TOPOF=new Float32Array(need);
    for(let j=0;j<TOPOH;j++){
      const gy=TOPOY+j*TOPOS;
      for(let i=0;i<TOPOW;i++){
        const gx=TOPOX+i*TOPOS;
        TOPOF[j*TOPOW+i]=vn(gx*0.085,gy*0.135,1501)+0.35*vn(gx*0.2+td*0.04,gy*0.31,1502);
      }
    }
  }
  else if(nm==="WAVEFIELD"){
    WFSRC.length=0;
    for(let k=0;k<3;k++)WFSRC.push([
      cr.x0+(0.22+0.56*h31(k,0,1510))*cw2,
      cr.y0+(0.22+0.56*h31(k,1,1511))*ch2,
      1.0+0.28*k]);
  }

  if(cw2>26){
    const lab=INSTR[INST]+" · "+MODE+" · "+String(pct).padStart(3," ")+"%";
    for(let i=0;i<lab.length&&cr.x0+2+i<cr.x1;i++)
      cput(cr.x0+2+i,cr.y1-1,lab[i],0.5,true);
  }
}
function fieldGlyph(x,y){
  const nm=INSTR[INST];
  if(!FIELD_INST[nm])return null;
  const cr=centerRect;
  if(x<=cr.x0||x>=cr.x1||y<=cr.y0||y>=cr.y1)return null;
  if(nm==="TOPO"){
    if(!TOPOF)return null;
    const f=topoAt(x,y);
    const lv=f*7+TD*0.12;
    const fr=Math.abs(lv-Math.round(lv));
    if(fr<0.085){
      const gx=topoAt(x+1,y)-topoAt(x-1,y),gy=topoAt(x,y+1)-topoAt(x,y-1);
      return{ch:slopeCh(Math.atan2(gy*AR,gx)+Math.PI/2),
             b:0.2+0.42*(1-fr/0.085),acc:((Math.round(lv)%3)+3)%3===0};
    }
    return null;
  }
  if(nm==="VORONOI"){
    let b1=1e9,b2=1e9,i1=-1,i2=-1;
    for(let k=0;k<VORSEED.length;k++){
      const q=VORSEED[k],ddx=(x-q[0])/AR,ddy=y-q[1];
      const dd=ddx*ddx+ddy*ddy;
      if(dd<b1){b2=b1;i2=i1;b1=dd;i1=k;}else if(dd<b2){b2=dd;i2=k;}
    }
    if(i2<0)return null;
    const e=Math.sqrt(b2)-Math.sqrt(b1);
    if(e<0.9){
      const A=VORSEED[i1],B=VORSEED[i2];
      return{ch:slopeCh(Math.atan2(B[1]-A[1],(B[0]-A[0])/AR)+Math.PI/2),
             b:0.18+0.44*(1-e/0.9)};
    }
    if(((x*2+y)%7)===0)return{ch:"·",b:0.10};
    return null;
  }
  let s=0;
  for(let k=0;k<WFSRC.length;k++){
    const q=WFSRC[k],ddx=(x-q[0])/AR,ddy=y-q[1];
    s+=Math.sin(Math.sqrt(ddx*ddx+ddy*ddy)*0.55-TD*q[2]);
  }
  const v=s/3;
  if(v>0.5){
    const i=Math.min(RAMP.length-1,2+Math.floor((v-0.5)/0.5*4));
    return{ch:RAMP[i],b:0.18+v*0.45,acc:v>0.9};
  }
  return null;
}
function centerGlyph(x,y,t){
  const b=CBUF.get(y*cols+x);
  if(b)return b;
  const f=fieldGlyph(x,y);
  if(f)return f;
  const cr=centerRect;
  if(x===cr.x0&&y===cr.y0)return{ch:"⌜",acc:true,b:0.6};
  if(x===cr.x1&&y===cr.y0)return{ch:"⌝",acc:true,b:0.6};
  if(x===cr.x0&&y===cr.y1)return{ch:"⌞",acc:true,b:0.6};
  if(x===cr.x1&&y===cr.y1)return{ch:"⌟",acc:true,b:0.6};
  const gs=INST%3;
  if(gs===0){
    if(x%8===0&&y%8===0){
      const tw=0.5+0.5*Math.sin(TD*1.2+x*3.1+y*2.7+SEEDN);
      return{ch:"┼",b:0.16+tw*0.06+amb*tw*0.22};
    }
    if(x%8===4&&y%8===4)return{ch:"·",b:0.10+amb*0.08};
  }else if(gs===1){
    if(x%12===0&&y%6===0)return{ch:"+",b:0.14+amb*0.14};
    if(x%6===0&&y%6===3)return{ch:"·",b:0.09+amb*0.07};
  }else{
    if(x%10===0&&y%10===0)return{ch:"·",b:0.12+amb*0.12};
  }
  return null;
}

/* ---------- corruption ---------- */
function waveDist(y){return Math.abs(y-by);}
/* block-displacement: crisp macroblocks shear sideways; the whole
   band re-randomises every ~second, pure per (row, td, hash). */
function blockDisp(r){
  const tq=Math.floor(TD*0.9);
  const BH=6;
  const b=Math.floor(r/BH);
  /* ambient shears fewer blocks and shears them less far; reconfig is
     the glitchiest moment, not the calmest. */
  const frac=0.34*lerp(1,0.30,amb)+(reconfig>0?0.34:0);
  if(h31(b,3,tq)>=frac)return 0;
  const inb=r-b*BH;
  if(inb===0||inb===BH-1)return 0;
  /* the round must wrap the whole expression: a fractional shift makes
     sx fractional, and every str[lx] lookup downstream returns undefined. */
  return Math.round((h31(b,4,tq)-0.5)*6*lerp(1,0.45,amb));
}
function CAt(x,y,t){
  const i=y*cols+x;
  let c=LAT[i]*(0.55+BL*0.85);
  c+=tide*(0.16+0.4*LAT[i]);
  const wd=waveDist(y);
  if(wd<6)c+=(1-wd/6)*lerp(1,0.5,amb);
  return c>1?1:c;
}

/* ---------- reconfiguration ---------- */
function ambLen(n){return Math.round(AMB_CYCLE*(0.62+h31(n,7,1307)*0.85));}
function setHarm(i){HARM=HARMS[i][0];HOFF=HARMS[i][1];}
function doReconfig(){
  ambCycleN++;
  const n=ambCycleN;
  SKIN=(SKIN+1+Math.floor(h31(n,1,1301)*(ARCH.length-1)))%ARCH.length;
  INST=(INST+1+Math.floor(h31(n,2,1302)*(INSTR.length-1)))%INSTR.length;
  hueStep=(hueStep+HUE_STEPS[Math.floor(h31(n,3,1303)*HUE_STEPS.length)])%360;
  if(h31(n,4,1304)<0.72)PALI=(PALI+1+Math.floor(h31(n,5,1305)*(PALETTES.length-1)))%PALETTES.length;
  if(h31(n,6,1306)<0.55)setHarm(Math.floor(h31(n,8,1308)*HARMS.length));
  ASSIGN_SALT=n;
  applySkin(ASSIGN_SALT);
  reconfig=RECONFIG_LEN;
  nextReconfig=tick+ambLen(n);
  hud={msg:"RECONFIG · "+ARCH[SKIN].name+" · "+INSTR[INST]+" · "+PALETTES[PALI].name,until:tick+160};
}

/* ---------- build ---------- */
function build(hash){
  HASH=hash;R=makeR(hash);SEEDN=R()*1000;
  HUE0=R()*360;
  setHarm(Math.floor(R()*HARMS.length));
  MODE=["DIAG","RECOVERY","RECONSTRUCT","FAILSAFE","PATCH","SCAVENGE","SELF-TEST","CRYO","AFTERGLOW","REBUILD"][Math.floor(R()*10)];
  SYSID=(R()*0xFFFFFF|0).toString(16).padStart(6,"0").toUpperCase();
  SCT_CNT=3+Math.floor(h31(9,0,971)*3);
  blips=[];
  for(let k=0;k<5;k++)blips.push({ang:h31(k,0,950)*TAU,per:90+Math.floor(h31(k,1,951)*180)});
  tick=0;timeOff=0;scrollVel=0;probeX=-1;
  ambT=R()<0.35?1:0;amb=ambT;VIEW=ambT?"AMBIENT":"DIAG";
  SKIN=Math.floor(R()*ARCH.length);
  INST=Math.floor(R()*INSTR.length);
  PALI=Math.floor(R()*PALETTES.length);
  hueStep=0;HUE_DRIFT_BASE=R()*360;reconfig=0;
  ambCycleN=0;ASSIGN_SALT=Math.floor(R()*1000);
  computeLatent();
  layout();applySkin(ASSIGN_SALT);
  nextReconfig=ambT?ambLen(0):1e9;
  hud={msg:"SYSTEM RESTART · "+MODE+" · "+ARCH[SKIN].name+" · "+INSTR[INST],until:tick+120};
}

/* ---------- input ---------- */
addEventListener("wheel",e=>{scrollVel-=e.deltaY*0.02;},{passive:true});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="r")build(newHash());
  else if(e.key===" "){e.preventDefault();paused=!paused;}
  else if(k==="m"){
    ambT=ambT?0:1;VIEW=ambT?"AMBIENT":"DIAG";
    if(ambT)nextReconfig=tick+ambLen(ambCycleN);else nextReconfig=1e9;
    hud={msg:ambT?"ENTERING AMBIENT":"RETURNING TO DIAGNOSTICS",until:tick+120};
  }
  else if(k==="n"){
    SKIN=(SKIN+1)%ARCH.length;ASSIGN_SALT++;applySkin(ASSIGN_SALT);
    reconfig=RECONFIG_LEN;hud={msg:"LAYOUT · "+ARCH[SKIN].name,until:tick+120};
  }
  else if(k==="v"){
    INST=(INST+1)%INSTR.length;
    hud={msg:"INSTRUMENT · "+INSTR[INST],until:tick+120};
  }
  else if(k==="c"){
    PALI=(PALI+1)%PALETTES.length;
    hueStep=(hueStep+HUE_STEPS[PALI%HUE_STEPS.length])%360;
    setHarm((HARMS.findIndex(h=>h[0]===HARM)+1)%HARMS.length);
    hud={msg:"PALETTE · "+PALETTES[PALI].name+" · "+HARM,until:tick+120};
  }
  else if(k==="f")toggleFullscreen();
  else if(k==="s"){
    const a=document.createElement("a");
    a.download="corrupt_"+HASH.slice(0,8)+".png";a.href=cv.toDataURL("image/png");a.click();
  }
});
function toggleFullscreen(){
  if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}
  else{const d=document.documentElement;if(d&&d.requestFullscreen)d.requestFullscreen();}
}
addEventListener("dblclick",toggleFullscreen);
addEventListener("mousemove",e=>{
  probeX=Math.floor(e.clientX/CW);probeY=Math.floor(e.clientY/CH);
  probeC=0;
  if(probeX>=0&&probeX<cols&&probeY>=0&&probeY<rows)probeC=CAt(probeX,probeY,tick/30);
});

/* ---------- sizing ---------- */
function resize(){
  const dpr=Math.min(2,devicePixelRatio||1);
  cols=Math.floor(innerWidth/CW);rows=Math.floor(innerHeight/CH);
  N=cols*rows;
  cv.width=cols*CW*dpr;cv.height=rows*CH*dpr;
  cv.style.width=cols*CW+"px";cv.style.height=rows*CH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textBaseline="top";
  layout();applySkin(ASSIGN_SALT);
  computeLatent();
  wf=new Array(cols).fill(0);
}
addEventListener("resize",resize);

/* ---------- tick ---------- */
function corruptTick(){
  if(!paused)tick++;
  timeOff+=scrollVel;scrollVel*=0.86;
  if(tick+timeOff<0)timeOff=-tick;
  amb+=(ambT-amb)*0.06;
  if(Math.abs(ambT-amb)<0.005)amb=ambT;
  if(ambT>0.5&&tick>=nextReconfig)doReconfig();
  if(reconfig>0)reconfig--;
}

/* ---------- render ---------- */
function render(){
  const t=(tick+timeOff)/30;
  const ts=lerp(1,0.35,amb);
  const td=t*ts;
  TD=td;
  MEMO.clear();
  const P=PALETTES[PALI];
  const dim=P.lm;                             /* ambient no longer dims the plate */
  const rec=reconfig>0?reconfig/RECONFIG_LEN:0;
  const breath=1+lerp(0.04,0.10,amb)*Math.sin(t*lerp(0.7,0.45,amb)+SEEDN);
  /* colour: jump per reconfig + a slow continuous drift while ambient */
  HUE_CUR=(HUE0+amb*((hueStep+HUE_DRIFT_BASE)%360)+amb*td*0.80+amb*10*Math.sin(t*0.05+SEEDN))%360;
  BL=clamp01(tick/2700);
  tide=vn(td*0.028,999,911);
  if(reconfig>0)tide=Math.min(1,tide+(Math.sin(t*10)>0?0.4:0));
  const wt=td*30;
  const wp=((wt%WAVE_PERIOD)+WAVE_PERIOD)%WAVE_PERIOD/WAVE_PERIOD;
  by=rows*(0.5-0.5*Math.cos(wp*6.2832));
  dx=Math.round((vn(by*3.3,td*0.9,921)-0.5)*7*lerp(1,0.3,amb)*(1+rec));
  scanY=(td*0.7)%rows;
  avgC=clamp01(meanLat+BL*0.3+tide*0.5);
  pct=Math.max(2,Math.round(100*(1-Math.min(1,avgC*1.25))));
  sigDB=Math.round(-35-tide*22-BL*20);

  buildCenter(td);

  const cr=centerRect;
  const ch2=cr.y1-cr.y0;
  const midW=cr.y0+Math.floor(ch2*0.72);
  const ampW=Math.max(2,Math.floor(ch2*0.12*lerp(1,0.6,amb)));
  for(let x=0;x<cols;x++)wf[x]=midW+Math.floor((vn(x*0.11,td*0.16,601)-0.5)*ampW*2);

  const bg=hsl(HUE_CUR+P.bgh,P.bs*lerp(0.85,1.25,amb),0.010+0.02*amb*(0.5+0.5*Math.sin(t*0.45+SEEDN)));
  ctx.fillStyle="rgb("+bg[0]+","+bg[1]+","+bg[2]+")";
  ctx.fillRect(0,0,cols*CW,rows*CH);
  ctx.font="13px 'SF Mono',Menlo,Consolas,monospace";

  for(let r=0;r<rows;r++){
    const yy=r*CH;
    const disp=waveDist(r)<6?dx:blockDisp(r);
    for(let c=0;c<cols;c++){
      const sx=c-disp;
      const z=zoneAt(sx,r);
      let g=null;
      if(z!=="TITLE"&&z!=="BOTTOM"&&z!=="CENTER"){
        const p=PINDEX[z];
        const onEdge=sx===p.x0||sx===p.x1||r===p.y0||r===p.y1;
        if(onEdge)g={ch:edgeCh(sx,r,p),b:0.3};
        else g=SPEC[z].d(sx,r,t,p);
      }
      else if(z==="TITLE")g=titleGlyph(sx,r,t);
      else if(z==="BOTTOM")g=bottomGlyph(sx,r,t);
      else g=centerGlyph(sx,r,t);
      if(!g)continue;

      const cc=CAt(c,r,t);
      if(cc>0.78)continue;
      if(cc>0.62){
        const dc=DEB[Math.floor(h31(sx,r,Math.floor(td*6)+1)*DEB.length)];
        const col=hsl(HUE_CUR+HOFF,P.as*0.92,0.16+0.24*(1-cc));
        ctx.fillStyle="rgb("+col[0]+","+col[1]+","+col[2]+")";
        ctx.fillText(dc,c*CW,yy);
        continue;
      }
      const hue=g.acc?HUE_CUR+HOFF:g.warn?0:zoneHue(z);
      let lig=0.14+g.b*0.52;
      if(g.acc)lig=Math.min(0.95,lig*0.72+P.al*0.42);
      if(Math.abs(r-scanY)<1)lig=Math.min(0.95,lig+0.3);
      if(cc>0.28)lig*=(1-(cc-0.28)*0.85);
      lig*=dim*breath*(1-0.45*rec);
      const col=hsl(hue,g.warn?P.ws:g.acc?P.as:P.s,lig);
      const cs="rgb("+col[0]+","+col[1]+","+col[2]+")";
      if(cc>0.28){
        ctx.fillStyle="rgba("+col[0]+",0,0,0.5)";
        ctx.fillText(g.ch,(c-1)*CW,yy);
        ctx.fillStyle="rgba(0,"+col[1]+","+col[2]+",0.5)";
        ctx.fillText(g.ch,(c+1)*CW,yy);
      }
      ctx.fillStyle=cs;
      ctx.fillText(g.ch,c*CW,yy);
    }
  }

  const acc=hsl(HUE_CUR+HOFF,P.as,P.al);
  /* waveform trace, only under instruments that leave room for it */
  if(INSTR_TRACE[INSTR[INST]]){
    for(let x=cr.x0+1;x<=cr.x1;x++){
      const y=wf[x];
      if(y===undefined||y<TOPY||y>BOTY-1)continue;
      const d=y-wf[x-1];
      ctx.fillStyle=d>0?"rgba("+acc[0]+","+acc[1]+","+acc[2]+",0.7)":"rgba("+acc[0]+","+acc[1]+","+acc[2]+",0.42)";
      ctx.fillText(d>0?"╲":d<0?"╱":"─",x*CW,y*CH);
    }
  }

  /* ambient embers drifting up */
  const emAbs=lerp(0.25,0.85,amb);
  for(let k=0;k<EMBERS;k++){
    const sx0=h31(k,0,801)*cols;
    const sp=0.5+h31(k,1,802)*2.2;
    const ph=h31(k,2,803)*400;
    const wfq=0.4+h31(k,3,804)*2;
    const wa=0.5+h31(k,4,805)*3;
    const ey=rows+2-(((td*sp+ph)%(rows+6)));
    const ex=sx0+Math.sin(td*wfq+ph)*wa;
    if(ey<0||ey>=rows)continue;
    const xi=Math.floor(ex);
    if(xi<0||xi>=cols)continue;
    const b=(0.15+0.5*h31(k,5,806))*(0.7+0.3*Math.sin(td*2+k));
    const ec=hsl(HUE_CUR+HOFF,P.as*0.6,0.35+b*0.35);
    ctx.fillStyle="rgba("+ec[0]+","+ec[1]+","+ec[2]+","+(emAbs*b).toFixed(3)+")";
    ctx.fillText(b>0.6?"∙":"·",xi*CW,Math.floor(ey)*CH);
  }

  ctx.fillStyle="rgba(255,255,255,0.022)";
  ctx.fillRect(0,scanY*CH,cols*CW,CH);

  if(hud.until>tick){
    ctx.fillStyle="rgb("+acc[0]+","+acc[1]+","+acc[2]+")";
    ctx.fillText(hud.msg,cols*CW-10-ctx.measureText(hud.msg).width,rows*CH-16);
  }
}

/* ---------- fixed-clock loop ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT)lastT=ts;
  acc+=ts-lastT;lastT=ts;
  let steps=0;
  while(acc>=TICK_MS&&steps<4){corruptTick();acc-=TICK_MS;steps++;}
  if(acc>200)acc=0;
  if(steps>0)render();
}

/* ---------- boot ---------- */
resize();
build(location.hash?decodeURIComponent(location.hash.slice(1)):newHash());
requestAnimationFrame(loop);
</script>
</body>
